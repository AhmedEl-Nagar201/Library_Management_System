<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h1 class="text-2xl font-bold text-center mb-6">Library Management System</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="login-email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="login-password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Login</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden"></p>
            <div class="mt-4 text-xs text-gray-500">
                <p>Demo accounts (create via SQL first):</p>
                <p>admin@library.com / admin123</p>
                <p>librarian@library.com / lib123</p>
                <p>member@library.com / member123</p>
            </div>
        </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div id="main-app" class="hidden">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-blue-600">Library Management System</h1>
                <div class="flex items-center space-x-4">
                    <span id="user-info" class="text-gray-700"></span>
                    <span id="user-role-badge" class="px-2 py-1 text-xs font-bold rounded"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <!-- Role-based Quick Actions -->
            <div id="quick-actions" class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Dynamically populated based on role -->
            </div>
            
            <!-- Tab Navigation -->
            <div class="mb-6">
                <div class="border-b border-gray-200">
                    <nav class="-mb-px flex space-x-4 overflow-x-auto pb-2">
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm active border-blue-500 text-blue-600" data-tab="dashboard">Dashboard</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="users">Users</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="books">Books</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="book-copies">Book Copies</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="loans">Loans</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="reservations">Reservations</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="fines">Fines</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="authors">Authors</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="categories">Categories</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="membership-tiers">Membership Tiers</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="languages">Languages</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="author-roles">Author Roles</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="copy-conditions">Copy Conditions</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="user-phones">User Phones</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="book-languages">Book Languages</button>
                        <button class="tab-btn whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="book-authors">Book Authors</button>
                    </nav>
                </div>
            </div>

            <!-- Content Areas -->
            <div id="content-area" class="bg-white rounded-lg shadow p-6">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal for forms -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentUser = null;
        let currentTab = 'dashboard';
        let editingId = null;
        let lookupData = {};

        // Login handling
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-info').textContent = `${currentUser.first_name} ${currentUser.last_name}`;
                    
                    const roleBadge = document.getElementById('user-role-badge');
                    roleBadge.textContent = currentUser.role.toUpperCase();
                    roleBadge.className = `px-2 py-1 text-xs font-bold rounded ${
                        currentUser.role === 'admin' ? 'bg-red-100 text-red-800' :
                        currentUser.role === 'librarian' ? 'bg-blue-100 text-blue-800' :
                        'bg-green-100 text-green-800'
                    }`;
                    
                    loadLookupData();
                    renderQuickActions();
                    renderContent();
                } else {
                    const error = await response.json();
                    document.getElementById('login-error').textContent = error.error || 'Login failed';
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Cannot connect to server. Make sure it is running.';
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        function logout() {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-form').reset();
            document.getElementById('login-error').classList.add('hidden');
        }

        async function loadLookupData() {
            try {
                const [tiers, categories, languages, roles, conditions] = await Promise.all([
                    fetch(`${API_BASE}/membership-tiers`).then(r => r.json()),
                    fetch(`${API_BASE}/categories`).then(r => r.json()),
                    fetch(`${API_BASE}/languages`).then(r => r.json()),
                    fetch(`${API_BASE}/author-roles`).then(r => r.json()),
                    fetch(`${API_BASE}/copy-conditions`).then(r => r.json())
                ]);
                lookupData = { tiers, categories, languages, roles, conditions };
            } catch (err) {
                console.error('Failed to load lookup data:', err);
            }
        }

        function renderQuickActions() {
            const container = document.getElementById('quick-actions');
            if (!currentUser) return;
            
            let actions = [];
            if (currentUser.role === 'member') {
                actions = [
                    { label: 'My Loans', tab: 'loans', icon: '📚' },
                    { label: 'My Reservations', tab: 'reservations', icon: '📅' },
                    { label: 'Browse Books', tab: 'books', icon: '📖' }
                ];
            } else if (currentUser.role === 'librarian') {
                actions = [
                    { label: 'Issue Loan', action: 'newLoan', icon: '➕' },
                    { label: 'Process Return', action: 'processReturn', icon: '↩️' },
                    { label: 'Manage Books', tab: 'books', icon: '📚' }
                ];
            } else if (currentUser.role === 'admin') {
                actions = [
                    { label: 'Manage Users', tab: 'users', icon: '👥' },
                    { label: 'System Settings', tab: 'membership-tiers', icon: '⚙️' },
                    { label: 'View All Loans', tab: 'loans', icon: '📊' }
                ];
            }
            
            container.innerHTML = actions.map(a => `
                <button onclick="${a.action ? `handleQuickAction('${a.action}')` : `switchTab('${a.tab}')`}" 
                    class="bg-white p-4 rounded-lg shadow hover:shadow-md transition flex items-center space-x-3">
                    <span class="text-2xl">${a.icon}</span>
                    <span class="font-medium">${a.label}</span>
                </button>
            `).join('');
        }

        function handleQuickAction(action) {
            if (action === 'newLoan') {
                switchTab('loans');
                setTimeout(() => showForm(), 100);
            } else if (action === 'processReturn') {
                switchTab('loans');
            }
        }

        function switchTab(tab) {
            document.querySelector(`[data-tab="${tab}"]`)?.click();
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'border-blue-500', 'text-blue-600');
                    b.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                });
                btn.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                btn.classList.add('active', 'border-blue-500', 'text-blue-600');
                currentTab = btn.dataset.tab;
                renderContent();
            });
        });

        async function renderContent() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="text-center py-8">Loading...</div>';
            
            try {
                if (currentTab === 'dashboard') {
                    renderDashboard(contentArea);
                    return;
                }
                
                const endpoint = currentTab.replace(/-/g, '-');
                const response = await fetch(`${API_BASE}/${endpoint}`);
                if (!response.ok) throw new Error('Failed to fetch data');
                const data = await response.json();
                
                renderTable(contentArea, data);
            } catch (err) {
                contentArea.innerHTML = `<div class="text-red-500">Error loading data: ${err.message}</div>`;
            }
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <h2 class="text-2xl font-bold mb-6">Welcome, ${currentUser.first_name}!</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <h3 class="text-sm font-medium text-blue-800">Your Role</h3>
                        <p class="text-2xl font-bold text-blue-600 capitalize">${currentUser.role}</p>
                    </div>
                </div>
                <div class="mt-6">
                    <h3 class="text-lg font-bold mb-2">Available Tables</h3>
                    <p class="text-gray-600">Use the tabs above to navigate through different sections of the library management system.</p>
                </div>
            `;
        }

        function renderTable(container, data) {
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">${formatTableName(currentTab)}</h2>
                        ${canEdit() ? `<button onclick="showForm()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Add New</button>` : ''}
                    </div>
                    <p class="text-gray-500">No records found.</p>
                `;
                return;
            }
            
            const columns = Object.keys(data[0]);
            const idField = columns.find(c => c.endsWith('_id')) || columns[0];
            
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">${formatTableName(currentTab)}</h2>
                    ${canEdit() ? `<button onclick="showForm()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Add New</button>` : ''}
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr class="bg-gray-100">
                                ${columns.map(col => `<th class="py-2 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${col}</th>`).join('')}
                                ${canEdit() ? '<th class="py-2 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(row => `
                                <tr class="border-b hover:bg-gray-50">
                                    ${columns.map(col => `<td class="py-2 px-4 text-sm text-gray-900">${formatValue(row[col])}</td>`).join('')}
                                    ${canEdit() ? `
                                        <td class="py-2 px-4 text-sm">
                                            <button onclick="editItem(${row[idField]})" class="text-blue-600 hover:text-blue-800 mr-2">Edit</button>
                                            <button onclick="deleteItem(${row[idField]})" class="text-red-600 hover:text-red-800">Delete</button>
                                        </td>
                                    ` : ''}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = html;
            container.dataset.idField = idField;
            container.dataset.data = JSON.stringify(data);
        }

        function formatValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'boolean') return val ? 'Yes' : 'No';
            return String(val);
        }

        function formatTableName(name) {
            return name.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function canEdit() {
            return currentUser && (currentUser.role === 'admin' || currentUser.role === 'librarian');
        }

        function showModal(content) {
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function showForm(editData = null) {
            editingId = editData;
            const endpoint = currentTab.replace(/-/g, '-');
            
            let formData = null;
            if (editData) {
                const container = document.getElementById('content-area');
                const allData = JSON.parse(container.dataset.data || '[]');
                const idField = container.dataset.idField;
                formData = allData.find(r => r[idField] == editData);
            }
            
            const schema = getFormSchema(currentTab);
            
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">${editData ? 'Edit' : 'Add'} ${formatTableName(currentTab)}</h2>
                    <button onclick="hideModal()" class="text-gray-500 hover:text-gray-700">✕</button>
                </div>
                <form onsubmit="saveForm(event)" class="space-y-4">
            `;
            
            schema.fields.forEach(field => {
                const value = formData ? formData[field.name] : field.default || '';
                const required = field.required ? 'required' : '';
                const step = field.type === 'number' && field.step ? `step="${field.step}"` : '';
                const min = field.min !== undefined ? `min="${field.min}"` : '';
                const max = field.max !== undefined ? `max="${field.max}"` : '';
                
                html += `<div>`;
                html += `<label class="block text-sm font-medium text-gray-700 mb-1">${field.label}</label>`;
                
                if (field.type === 'select') {
                    const options = lookupData[field.options] || [];
                    html += `<select name="${field.name}" class="w-full border rounded-md p-2" ${required}>`;
                    html += `<option value="">Select ${field.label}</option>`;
                    options.forEach(opt => {
                        const optVal = opt[field.valueField || 'name'] || opt[Object.keys(opt)[0]];
                        const optLabel = opt[field.labelField || 'name'] || opt[Object.keys(opt)[1] || Object.keys(opt)[0]];
                        const selected = value == optVal ? 'selected' : '';
                        html += `<option value="${optVal}" ${selected}>${optLabel}</option>`;
                    });
                    html += `</select>`;
                } else if (field.type === 'textarea') {
                    html += `<textarea name="${field.name}" rows="3" class="w-full border rounded-md p-2" ${required}>${value || ''}</textarea>`;
                } else {
                    html += `<input type="${field.type}" name="${field.name}" value="${value || ''}" class="w-full border rounded-md p-2" ${required} ${step} ${min} ${max}>`;
                }
                
                html += `</div>`;
            });
            
            html += `
                <div class="flex space-x-2 pt-4">
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Save</button>
                    <button type="button" onclick="hideModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">Cancel</button>
                </div>
                </form>
            `;
            
            showModal(html);
        }

        function getFormSchema(tableName) {
            const schemas = {
                'membership-tiers': {
                    endpoint: 'membership-tiers',
                    fields: [
                        { name: 'tier_name', label: 'Tier Name', type: 'text', required: true },
                        { name: 'max_books', label: 'Max Books', type: 'number', min: 1, max: 20, required: true },
                        { name: 'loan_duration_days', label: 'Loan Duration (Days)', type: 'number', min: 1, max: 90, required: true },
                        { name: 'fine_per_day', label: 'Fine Per Day', type: 'number', step: '0.01', min: 0, required: true }
                    ]
                },
                'users': {
                    endpoint: 'users',
                    fields: [
                        { name: 'first_name', label: 'First Name', type: 'text', required: true },
                        { name: 'last_name', label: 'Last Name', type: 'text', required: true },
                        { name: 'email', label: 'Email', type: 'email', required: true },
                        { name: 'national_id', label: 'National ID', type: 'text' },
                        { name: 'street_address', label: 'Street Address', type: 'text' },
                        { name: 'city', label: 'City', type: 'text' },
                        { name: 'state_province', label: 'State/Province', type: 'text' },
                        { name: 'postal_code', label: 'Postal Code', type: 'text' },
                        { name: 'country', label: 'Country', type: 'text', default: 'Egypt' },
                        { name: 'role', label: 'Role', type: 'select', options: 'enum:member,librarian,admin', required: true },
                        { name: 'tier_id', label: 'Membership Tier', type: 'select', options: 'tiers', valueField: 'tier_id', labelField: 'tier_name', required: true },
                        { name: 'is_active', label: 'Is Active', type: 'checkbox', default: 1 },
                        { name: 'password_hash', label: 'Password', type: 'password', required: !editingId }
                    ]
                },
                'user-phones': {
                    endpoint: 'user-phones',
                    fields: [
                        { name: 'user_id', label: 'User', type: 'select', options: 'users', valueField: 'user_id', labelField: 'email', required: true },
                        { name: 'phone_number', label: 'Phone Number', type: 'tel', required: true },
                        { name: 'phone_type', label: 'Type', type: 'select', options: 'enum:mobile,home,work,fax', default: 'mobile' },
                        { name: 'is_primary', label: 'Is Primary', type: 'checkbox', default: 0 }
                    ]
                },
                'categories': {
                    endpoint: 'categories',
                    fields: [
                        { name: 'name', label: 'Name', type: 'text', required: true },
                        { name: 'parent_id', label: 'Parent Category', type: 'select', options: 'categories', valueField: 'category_id', labelField: 'name' },
                        { name: 'description', label: 'Description', type: 'textarea' }
                    ]
                },
                'languages': {
                    endpoint: 'languages',
                    fields: [
                        { name: 'language_name', label: 'Language Name', type: 'text', required: true },
                        { name: 'iso_code', label: 'ISO Code', type: 'text', required: true, default: 'eng' }
                    ]
                },
                'author-roles': {
                    endpoint: 'author-roles',
                    fields: [
                        { name: 'role_name', label: 'Role Name', type: 'text', required: true }
                    ]
                },
                'copy-conditions': {
                    endpoint: 'copy-conditions',
                    fields: [
                        { name: 'condition_name', label: 'Condition Name', type: 'text', required: true },
                        { name: 'description', label: 'Description', type: 'textarea' }
                    ]
                },
                'authors': {
                    endpoint: 'authors',
                    fields: [
                        { name: 'first_name', label: 'First Name', type: 'text', required: true },
                        { name: 'last_name', label: 'Last Name', type: 'text', required: true },
                        { name: 'bio', label: 'Bio', type: 'textarea' },
                        { name: 'birth_year', label: 'Birth Year', type: 'number' },
                        { name: 'nationality', label: 'Nationality', type: 'text' }
                    ]
                },
                'books': {
                    endpoint: 'books',
                    fields: [
                        { name: 'isbn', label: 'ISBN', type: 'text', required: true },
                        { name: 'title', label: 'Title', type: 'text', required: true },
                        { name: 'category_id', label: 'Category', type: 'select', options: 'categories', valueField: 'category_id', labelField: 'name' },
                        { name: 'publisher', label: 'Publisher', type: 'text' },
                        { name: 'published_year', label: 'Published Year', type: 'number' },
                        { name: 'edition', label: 'Edition', type: 'text' },
                        { name: 'description', label: 'Description', type: 'textarea' },
                        { name: 'cover_image_url', label: 'Cover Image URL', type: 'url' }
                    ]
                },
                'book-languages': {
                    endpoint: 'book-languages',
                    fields: [
                        { name: 'book_id', label: 'Book', type: 'select', options: 'books', valueField: 'book_id', labelField: 'title', required: true },
                        { name: 'language_id', label: 'Language', type: 'select', options: 'languages', valueField: 'language_id', labelField: 'language_name', required: true }
                    ]
                },
                'book-authors': {
                    endpoint: 'book-authors',
                    fields: [
                        { name: 'book_id', label: 'Book', type: 'select', options: 'books', valueField: 'book_id', labelField: 'title', required: true },
                        { name: 'author_id', label: 'Author', type: 'select', options: 'authors', valueField: 'author_id', labelField: 'last_name', required: true },
                        { name: 'role_id', label: 'Role', type: 'select', options: 'roles', valueField: 'role_id', labelField: 'role_name', required: true }
                    ]
                },
                'book-copies': {
                    endpoint: 'book-copies',
                    fields: [
                        { name: 'book_id', label: 'Book', type: 'select', options: 'books', valueField: 'book_id', labelField: 'title', required: true },
                        { name: 'barcode', label: 'Barcode', type: 'text' },
                        { name: 'condition_id', label: 'Condition', type: 'select', options: 'conditions', valueField: 'condition_id', labelField: 'condition_name', required: true },
                        { name: 'is_available', label: 'Available', type: 'checkbox', default: 1 },
                        { name: 'location_shelf', label: 'Shelf Location', type: 'text' },
                        { name: 'acquired_date', label: 'Acquired Date', type: 'date' }
                    ]
                },
                'loans': {
                    endpoint: 'loans',
                    fields: [
                        { name: 'user_id', label: 'Borrower', type: 'select', options: 'users', valueField: 'user_id', labelField: 'email', required: true },
                        { name: 'copy_id', label: 'Book Copy', type: 'select', options: 'book-copies', valueField: 'copy_id', labelField: 'barcode', required: true },
                        { name: 'issued_by', label: 'Issued By', type: 'select', options: 'users', valueField: 'user_id', labelField: 'email' },
                        { name: 'loan_date', label: 'Loan Date', type: 'date', required: true },
                        { name: 'due_date', label: 'Due Date', type: 'date', required: true },
                        { name: 'return_date', label: 'Return Date', type: 'date' },
                        { name: 'status', label: 'Status', type: 'select', options: 'enum:active,returned,overdue', default: 'active' },
                        { name: 'notes', label: 'Notes', type: 'textarea' }
                    ]
                },
                'reservations': {
                    endpoint: 'reservations',
                    fields: [
                        { name: 'user_id', label: 'User', type: 'select', options: 'users', valueField: 'user_id', labelField: 'email', required: true },
                        { name: 'book_id', label: 'Book', type: 'select', options: 'books', valueField: 'book_id', labelField: 'title', required: true },
                        { name: 'status', label: 'Status', type: 'select', options: 'enum:pending,fulfilled,cancelled,expired', default: 'pending' },
                        { name: 'fulfilled_loan', label: 'Fulfilled Loan ID', type: 'number' }
                    ]
                },
                'fines': {
                    endpoint: 'fines',
                    fields: [
                        { name: 'loan_id', label: 'Loan ID', type: 'number', required: true },
                        { name: 'user_id', label: 'User', type: 'select', options: 'users', valueField: 'user_id', labelField: 'email', required: true },
                        { name: 'overdue_days', label: 'Overdue Days', type: 'number', min: 1, required: true },
                        { name: 'amount', label: 'Amount', type: 'number', step: '0.01', min: 0, required: true },
                        { name: 'status', label: 'Status', type: 'select', options: 'enum:unpaid,paid,waived', default: 'unpaid' },
                        { name: 'notes', label: 'Notes', type: 'textarea' }
                    ]
                }
            };
            
            return schemas[tableName] || { endpoint: tableName, fields: [] };
        }

        async function saveForm(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Convert checkbox values
            Object.keys(data).forEach(key => {
                if (data[key] === 'on') data[key] = 1;
                if (data[key] === '') data[key] = null;
            });
            
            const schema = getFormSchema(currentTab);
            const endpoint = schema.endpoint;
            const method = editingId ? 'PUT' : 'POST';
            const url = editingId ? `${API_BASE}/${endpoint}/${editingId}` : `${API_BASE}/${endpoint}`;
            
            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    hideModal();
                    renderContent();
                } else {
                    const error = await response.json();
                    alert(`Error: ${error.error || 'Failed to save'}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        async function editItem(id) {
            showForm(id);
        }

        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            
            const endpoint = currentTab.replace(/-/g, '-');
            let url = `${API_BASE}/${endpoint}/${id}`;
            
            // Handle composite keys
            if (currentTab === 'book-languages' || currentTab === 'book-authors') {
                const container = document.getElementById('content-area');
                const allData = JSON.parse(container.dataset.data || '[]');
                const record = allData.find(r => {
                    const idField = container.dataset.idField;
                    return r[idField] == id;
                });
                
                if (currentTab === 'book-languages' && record) {
                    url = `${API_BASE}/book-languages/${record.book_id}/${record.language_id}`;
                } else if (currentTab === 'book-authors' && record) {
                    url = `${API_BASE}/book-authors/${record.book_id}/${record.author_id}/${record.role_id}`;
                }
            }
            
            try {
                const response = await fetch(url, { method: 'DELETE' });
                if (response.ok) {
                    renderContent();
                } else {
                    const error = await response.json();
                    alert(`Error: ${error.error || 'Failed to delete'}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        // Initialize - show login screen
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('main-app').classList.add('hidden');
    </script>
</body>
